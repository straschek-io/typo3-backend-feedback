name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:composer:validate
      - run: composer ci:yaml:lint
      - run: composer ci:php:cs
      - run: composer ci:php:stan

  tests:
    runs-on: ubuntu-latest
    name: tests (PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }})
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: ['^13.4', '^14.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: >
          composer require --no-update
          "typo3/cms-core:${{ matrix.typo3 }}"
          "typo3/cms-backend:${{ matrix.typo3 }}"
          "typo3/cms-fluid:${{ matrix.typo3 }}"
      - run: >
          composer require --dev --no-update
          "typo3/cms-filelist:${{ matrix.typo3 }}"
          "typo3/cms-install:${{ matrix.typo3 }}"
          "typo3/cms-setup:${{ matrix.typo3 }}"
      - run: composer install --no-progress --no-interaction
      - run: composer ci:php:unit
      - run: composer ci:php:functional
